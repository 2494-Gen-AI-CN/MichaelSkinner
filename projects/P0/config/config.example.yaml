bigquery:
  project: ${GCP_PROJECT}
  staging_dataset: p0_staging
  warehouse_dataset: p0_warehouse
  location: US

# Paths are relative to projects/P0, regardless of where the command is run.
# Olist's timestamps have no timezone, so they use BigQuery DATETIME.
# Monetary values use exact BigQuery NUMERIC values rather than floating point.
sources:
  - name: orders
    path: data/raw/olist_orders_dataset.csv
    format: csv
    key: [order_id]
    required: [customer_id, order_status, order_purchase_timestamp, order_estimated_delivery_date]
    schema:
      order_id: string
      customer_id: string
      order_status: string
      order_purchase_timestamp: datetime
      order_approved_at: datetime
      order_delivered_carrier_date: datetime
      order_delivered_customer_date: datetime
      order_estimated_delivery_date: datetime
    normalize:
      order_status: lower
    rules:
      order_status:
        allowed: [created, approved, invoiced, processing, shipped, delivered, unavailable, canceled]
      order_delivered_customer_date:
        required_when: {column: order_status, equals: delivered}
        not_before: order_purchase_timestamp
      order_estimated_delivery_date:
        not_before: order_purchase_timestamp

  - name: order_items
    path: data/raw/olist_order_items_dataset.csv
    format: csv
    key: [order_id, order_item_id]
    required: [product_id, seller_id, shipping_limit_date, price, freight_value]
    schema:
      order_id: string
      order_item_id: int
      product_id: string
      seller_id: string
      shipping_limit_date: datetime
      price: numeric
      freight_value: numeric
    rules:
      order_item_id: {min: 1}
      price: {min_exclusive: 0}
      freight_value: {min: 0}

  - name: products
    path: data/raw/olist_products_dataset.csv
    format: csv
    key: [product_id]
    schema:
      product_id: string
      product_category_name: string
      product_name_lenght: int
      product_description_lenght: int
      product_photos_qty: int
      product_weight_g: int
      product_length_cm: int
      product_height_cm: int
      product_width_cm: int
    rules:
      product_name_lenght: {min: 0}
      product_description_lenght: {min: 0}
      product_photos_qty: {min: 0}
      product_weight_g: {min: 0}
      product_length_cm: {min: 0}
      product_height_cm: {min: 0}
      product_width_cm: {min: 0}

  - name: sellers
    path: data/raw/olist_sellers_dataset.csv
    format: csv
    key: [seller_id]
    required: [seller_state]
    schema:
      seller_id: string
      seller_zip_code_prefix: string
      seller_city: string
      seller_state: string
    normalize:
      seller_state: upper

  - name: customers
    path: data/raw/olist_customers_dataset.csv
    format: csv
    key: [customer_id]
    required: [customer_unique_id, customer_state]
    schema:
      customer_id: string
      customer_unique_id: string
      customer_zip_code_prefix: string
      customer_city: string
      customer_state: string
    normalize:
      customer_state: upper

  - name: reviews
    path: data/raw/olist_order_reviews_dataset.csv
    format: csv
    # review_id alone repeats across orders; preserve the source reviews here.
    key: [review_id, order_id]
    required: [review_score, review_creation_date, review_answer_timestamp]
    schema:
      review_id: string
      order_id: string
      review_score: int
      review_comment_title: string
      review_comment_message: string
      review_creation_date: datetime
      review_answer_timestamp: datetime
    rules:
      review_score: {min: 1, max: 5}

  - name: payments
    path: data/raw/olist_order_payments_dataset.csv
    format: csv
    key: [order_id, payment_sequential]
    required: [payment_type, payment_installments, payment_value]
    schema:
      order_id: string
      payment_sequential: int
      payment_type: string
      payment_installments: int
      payment_value: numeric
    normalize:
      payment_type: lower
    rules:
      payment_sequential: {min: 1}
      payment_installments: {min: 0}
      payment_value: {min: 0}
      payment_type:
        allowed: [credit_card, boleto, voucher, debit_card, not_defined]

  - name: category_translation
    path: data/raw/product_category_name_translation.csv
    format: csv
    key: [product_category_name]
    required: [product_category_name_english]
    schema:
      product_category_name: string
      product_category_name_english: string
